name: Builtin kernel build

# Compile check for the builtin branch: builds the Aero 4.19 kernel
# (mi89x7:mithorium) with this commit of the builtin driver + SUSFS.
on:
  push:
    branches: [builtin]
  pull_request:
    branches: [builtin]
  workflow_dispatch:

concurrency:
  group: builtin-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KSU_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      CCACHE_MAXSIZE: 2G
      CCACHE_NOHASHDIR: "1"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: file_macro,time_macros,include_file_ctime,include_file_mtime
    steps:
      - name: Checkout aero-kernel builder
        uses: actions/checkout@v4
        with:
          repository: afarhandanu/aero-kernel

      - name: Pin ZephyrSU builtin to the commit under test
        run: |
          f=scripts/goodies/kernelsu-builtin.sh
          sed -i "s|^KSU_SETUP_BRANCH=.*|KSU_SETUP_BRANCH=\"$KSU_REF\"|" "$f"
          grep -q "^KSU_SETUP_BRANCH=\"$KSU_REF\"$" "$f"
          # Fail if the checked-out driver is not the commit under test.
          sed -i "s|^\[ -f KernelSU/kernel/ksu_main.c \].*|&\n[ \"\$(git -C KernelSU rev-parse HEAD)\" = \"$KSU_REF\" ] \|\| { echo \"-- Fatal: KernelSU is not at $KSU_REF\"; exit 1; }|" "$f"
          grep -q "is not at $KSU_REF" "$f"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache/builtin/${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache/builtin/

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex zip p7zip-full curl git wget libssl-dev zstd lld python3 patchutils ccache libc6-dev unzip cpio

      - name: Build mi89x7 (mithorium) with ZephyrSU builtin + SUSFS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TYPE: Testing
          KSU_ENABLED: "true"
          SUSFS_ENABLED: "true"
        run: |
          export BUILD_DATE="$(date +'%Y%m%d')"
          chmod +x build.sh
          ./build.sh mi89x7 mithorium
